*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0302;color:#fff;font-family:'TSFont',Impact,'Arial Narrow',sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
a{color:#ffd21f}
.hide{display:none!important}
/* loader */
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#4a0a04,#0a0302 70%)}
#loader h1{margin:0;font-size:clamp(34px,8vw,92px);letter-spacing:.04em;line-height:.9;font-weight:400;background:linear-gradient(#fff6a0,#ffb000 45%,#ff3b00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 26px rgba(255,80,0,.5))}
#loader h1 small{display:block;font-size:.32em;letter-spacing:.32em;text-align:center;color:#ffd9a0;-webkit-text-fill-color:#ffd9a0}
.lbar{width:min(420px,70vw);height:12px;border:2px solid #ffb000;border-radius:7px;margin-top:22px;overflow:hidden;background:#200800}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff3b00,#ffd21f);transition:width .15s}
#ltxt{margin-top:10px;font-family:Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.2em;color:#ffbf80}
/* realbtn */
.realbtn{position:fixed;right:12px;top:10px;padding:8px 14px;border:2px solid #000;border-radius:8px;background:linear-gradient(#fff07a,#ffb400 50%,#ff5a00);color:#1a0700;text-decoration:none;font-size:clamp(13px,1.5vw,18px);letter-spacing:.06em;z-index:60;box-shadow:0 3px 0 #000,0 0 18px rgba(255,140,0,.55);line-height:1.05;text-align:center}
.realbtn small{display:block;font-size:.62em;letter-spacing:.1em;color:#5a1200}
.realbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}
body.playing .realbtn{padding:5px 10px;font-size:12px;opacity:.85;top:6px;right:8px}
body.playing .realbtn small{display:none}
/* screens */
.scr{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:12px;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(60,8,2,.35),rgba(5,1,0,.82) 75%);overflow:auto}
.scr.champ{justify-content:flex-start;padding-top:2vh}.scr.champ .big{margin-bottom:auto}.scr.champ .sub{margin-top:0}.scr.champ>.sub:nth-of-type(2){margin-top:auto}
.scr.clear{background:linear-gradient(transparent 40%,rgba(0,0,0,.7))}
.logo{font-size:clamp(40px,8.5vw,108px);line-height:.86;letter-spacing:.03em;margin:0;font-weight:400;background:linear-gradient(#fff6a0,#ffb000 45%,#ff3b00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 30px rgba(255,70,0,.55))}
.logo small{display:block;font-size:.27em;letter-spacing:.36em;-webkit-text-fill-color:#ffe2b0;color:#ffe2b0}
.sub{font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,1.4vw,15px);color:#ffcf9a;letter-spacing:.05em;margin:8px 0 4px;text-shadow:0 1px 3px #000}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:clamp(8px,2vh,20px);max-width:900px}
.b{font-family:inherit;font-size:clamp(16px,2vw,24px);letter-spacing:.06em;padding:10px 22px;border:2px solid #ffb000;border-radius:9px;background:linear-gradient(#3a0d04,#160402);color:#fff;cursor:pointer;box-shadow:0 4px 0 #000;text-decoration:none;display:inline-block;line-height:1.05}
.b:hover,.b.sel{background:linear-gradient(#ffd21f,#ff7a00);color:#160400;transform:translateY(-2px)}
.b.gold{background:linear-gradient(#fff07a,#ffb400 50%,#ff5a00);color:#1a0700;border-color:#000;box-shadow:0 4px 0 #000,0 0 22px rgba(255,140,0,.6)}
.b.gold span,.b span{display:block;font-size:.5em;letter-spacing:.12em;opacity:.85;font-family:Arial,sans-serif;font-weight:700}
.b.sm{font-size:clamp(13px,1.5vw,17px);padding:7px 14px}
.realcta{display:inline-block;margin-top:12px;padding:10px 20px;border:2px solid #000;border-radius:10px;background:linear-gradient(#fff07a,#ffb400 50%,#ff5a00);color:#1a0700;text-decoration:none;font-size:clamp(17px,2.4vw,28px);letter-spacing:.05em;box-shadow:0 4px 0 #000,0 0 30px rgba(255,120,0,.6);animation:pulse 1.6s infinite;line-height:1.05}
.realcta span{display:block;font-size:.5em;letter-spacing:.12em;color:#5a1200}
@keyframes pulse{50%{transform:scale(1.04)}}
.shareX{display:inline-block;margin:10px 6px 0;padding:7px 14px;border-radius:8px;background:#000;border:2px solid #fff;color:#fff;text-decoration:none;font-size:clamp(13px,1.5vw,17px);letter-spacing:.06em}
.mgx{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;margin-top:clamp(8px,1.8vh,16px);max-width:96vw}
.mgx-h{font-size:clamp(11px,1.25vw,14px);letter-spacing:.16em;color:#ffd21f;text-shadow:0 2px 0 #000;white-space:nowrap}
.mgx a.mgx-c{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:2px solid rgba(255,190,40,.85);border-radius:7px;background:rgba(10,4,0,.74);color:#fff;text-decoration:none;font-size:clamp(11px,1.2vw,14px);letter-spacing:.05em;box-shadow:0 3px 0 #000}
.mgx a.mgx-c img{width:clamp(34px,4.4vw,50px);height:auto;border-radius:4px;display:block}
.mgx a.mgx-c:hover{background:#ffb000;color:#120600}
.mgx-rate{margin-top:clamp(6px,1.4vh,12px);font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,1.3vw,14px);color:#ffe7a6;text-shadow:0 1px 3px #000}
.mgx-rate a{color:#ffd21f}
/* team select */
.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;max-width:820px;width:96vw}
.tm{border:2px solid #553;border-radius:9px;padding:8px 4px;background:rgba(10,3,0,.75);cursor:pointer;font-size:clamp(13px,1.6vw,19px);letter-spacing:.04em;position:relative}
.tm i{display:block;height:8px;border-radius:4px;margin:5px 10% 4px}
.tm em{display:block;font-style:normal;font-family:Arial,sans-serif;font-weight:700;font-size:10px;color:#ffcf9a;letter-spacing:.05em}
.tm.sel{border-color:#ffd21f;box-shadow:0 0 16px rgba(255,200,0,.6);background:rgba(70,20,0,.85)}
.tm.sel2{border-color:#ff3b30;box-shadow:0 0 16px rgba(255,40,0,.6)}
.tm .tg{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:10px;background:#ffd21f;color:#000;border-radius:4px;padding:0 5px}
.tm.sel2 .tg{background:#ff3b30;color:#fff}
.opts{display:grid;grid-template-columns:auto auto;gap:6px 14px;align-items:center;margin-top:10px;font-size:clamp(13px,1.5vw,17px)}
.opts label{text-align:right;color:#ffcf9a;letter-spacing:.08em}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font-family:inherit;font-size:clamp(12px,1.3vw,15px);padding:5px 10px;border:2px solid #7a4a10;border-radius:6px;background:#1a0602;color:#fff;cursor:pointer;letter-spacing:.05em}
.seg button.on{background:#ffb000;color:#120600;border-color:#ffd21f}
.ctl{font-family:Arial,sans-serif;font-weight:700;font-size:clamp(10px,1.15vw,13px);color:#ffe2c0;line-height:1.55;max-width:720px;margin-top:10px;text-align:left;columns:2;column-gap:28px}
.ctl b{display:inline-block;min-width:70px;color:#ffd21f;font-family:'TSFont',Impact,sans-serif;font-weight:400;letter-spacing:.06em}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}#hud::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 75% at 50% 52%,rgba(0,0,0,0) 50%,rgba(6,10,4,.38) 100%),radial-gradient(ellipse 60% 40% at 50% -8%,rgba(255,236,200,.13),rgba(0,0,0,0) 70%)}
#sb{position:absolute;left:12px;top:10px;display:flex;align-items:stretch;font-size:clamp(14px,1.8vw,22px);letter-spacing:.05em;box-shadow:0 3px 0 #000;border-radius:6px;overflow:hidden}
#sb .tn{padding:4px 10px;background:#111;display:flex;align-items:center;gap:6px}
#sb .tn i{width:6px;align-self:stretch;margin:-4px 0}
#sb .sc{padding:4px 10px;background:linear-gradient(#ffd21f,#ff8a00);color:#160400;min-width:64px;text-align:center}
#sb .ck{padding:4px 10px;background:#2a0702;color:#ffd9a0;min-width:58px;text-align:center}
#addt{position:absolute;left:12px;top:46px;background:#c01a10;padding:1px 8px;font-size:14px;border-radius:4px}
#radar{position:absolute;right:12px;bottom:10px;width:clamp(112px,11vw,160px);border:1px solid rgba(255,190,40,.45);border-radius:5px;background:rgba(0,0,0,.25);opacity:.72}
#callout{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:clamp(40px,8vw,96px);letter-spacing:.04em;line-height:.9;opacity:0;transition:opacity .25s,transform .25s;transform:scale(.8);background:linear-gradient(#fff6a0,#ffb000 45%,#ff3b00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000)}
#callout.on{opacity:1;transform:scale(1)}
#callout small{display:block;font-size:.3em;letter-spacing:.2em;-webkit-text-fill-color:#fff;color:#fff}
#comm{position:absolute;left:12px;bottom:12px;font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,1.3vw,14px);color:#fff;text-shadow:0 1px 3px #000;max-width:38vw;line-height:1.4}
#comm div{background:rgba(0,0,0,.45);padding:2px 8px;border-left:3px solid #ffb000;margin-top:3px;animation:cin .3s}
@keyframes cin{from{opacity:0;transform:translateX(-10px)}}
#pname{position:absolute;right:12px;bottom:12px;text-align:right;font-size:clamp(14px,1.7vw,20px);letter-spacing:.05em;text-shadow:0 2px 0 #000}
#pname .st{width:120px;height:6px;background:#300;border-radius:3px;margin-top:3px;margin-left:auto;overflow:hidden}
#pname .st i{display:block;height:100%;background:linear-gradient(90deg,#ff3b00,#4f4)}
#pow{position:absolute;left:50%;top:62%;transform:translateX(-50%);width:160px;height:10px;border:2px solid #000;background:#300;border-radius:5px;overflow:hidden;opacity:0}
#pow.on{opacity:1}#pow i{display:block;height:100%;background:linear-gradient(90deg,#ffd21f,#ff3b00)}
#bug{position:absolute;left:12px;top:calc(10px + clamp(14px,1.8vw,22px) + 14px);display:flex;font-size:11px;letter-spacing:.14em;box-shadow:0 2px 0 #000;border-radius:3px;overflow:hidden}
#bug b{background:#e0141e;color:#fff;padding:2px 7px;font-weight:400;animation:blink 2s infinite}#bug span{background:rgba(10,4,2,.85);color:#ffd9a0;padding:2px 8px}
#l3{position:absolute;left:50%;bottom:calc(26% + 20px);transform:translate(-50%,30px);opacity:0;transition:opacity .35s,transform .45s cubic-bezier(.2,1.4,.4,1);display:flex;align-items:stretch;pointer-events:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.55))}
