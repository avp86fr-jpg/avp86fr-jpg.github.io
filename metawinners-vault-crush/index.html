function drawTile(x,t,s,dx,dy,w,h,n,id){
 if(s===S.WILD){x.drawImage(ART.wildFrame(n,Math.floor(now*10)%8),dx,dy,w,h);return;}
 let ph=id!=null?(now*0.3+((id*0.6180339)%1))%1:1;if(t===6&&id!=null)ph=(now*0.7+(id*0.37)%1)%1; // idle shimmer sweep
 x.drawImage(ph<0.14?ART.shine(t,n,Math.min(ART.SHF-1,Math.floor(ph/0.14*ART.SHF))):ART.tile(t,n),dx,dy,w,h);
 if(s===S.H||s===S.V){const pulse=0.6+Math.sin(now*8)*0.3;x.globalCompositeOperation='lighter';x.globalAlpha=pulse;x.fillStyle='#bff6ff';
  if(s===S.H){x.fillRect(dx+w*0.04,dy+h*0.34,w*0.92,h*0.07);x.fillRect(dx+w*0.04,dy+h*0.59,w*0.92,h*0.07);}else{x.fillRect(dx+w*0.34,dy+h*0.04,w*0.07,h*0.92);x.fillRect(dx+w*0.59,dy+h*0.04,w*0.07,h*0.92);}
  x.globalAlpha=pulse*0.6;x.drawImage(glow('#36d7ff'),dx-w*0.2,dy-h*0.2,w*1.4,h*1.4);x.globalAlpha=1;x.globalCompositeOperation='source-over';
  x.fillStyle='#fff';x.beginPath();if(s===S.H){x.moveTo(dx,dy+h/2);x.lineTo(dx+w*0.14,dy+h*0.4);x.lineTo(dx+w*0.14,dy+h*0.6);x.moveTo(dx+w,dy+h/2);x.lineTo(dx+w*0.86,dy+h*0.4);x.lineTo(dx+w*0.86,dy+h*0.6);}else{x.moveTo(dx+w/2,dy);x.lineTo(dx+w*0.4,dy+h*0.14);x.lineTo(dx+w*0.6,dy+h*0.14);x.moveTo(dx+w/2,dy+h);x.lineTo(dx+w*0.4,dy+h*0.86);x.lineTo(dx+w*0.6,dy+h*0.86);}x.fill();}
 else if(s===S.BOMB){const pulse=0.5+Math.sin(now*6)*0.5;x.globalCompositeOperation='lighter';x.globalAlpha=0.5+pulse*0.4;x.drawImage(glow('#ffd34d'),dx-w*0.25,dy-h*0.25,w*1.5,h*1.5);x.globalAlpha=1;x.globalCompositeOperation='source-over';
  x.strokeStyle='#fff3a0';x.lineWidth=Math.max(2,w*0.07);x.beginPath();x.arc(dx+w/2,dy+h/2,w*0.47,0,7);x.stroke();
  x.fillStyle='#ffd34d';ART.star(x,dx+w*0.8,dy+h*0.18,w*0.16,w*0.07,4);x.fill();}}

 const d=showScreen(sndBtns()+'<div class="logo"><div class="mw">METAWINNERS · VAULT CRUSH</div><div class="vc" style="font-size:36px">BOUNTY<br>CLAIMED!</div></div>'+

 d.style.backgroundImage='linear-gradient(180deg,rgba(18,5,31,.5),rgba(18,5,31,.95) 60%),url('+ASSETS.bg_p+')';wireSnd(d);
 d.querySelector('#b-map').onclick=()=>{AU.sfx.click();map();};d.querySelector('#b-title').onclick=()=>{AU.sfx.click();title();};
 for(let k=0;k<3;k++)setTimeout(()=>AU.sfx.jackpot(),k*300);}

$('#b-snd').onclick=e=>{e.stopPropagation();AU.unlock();const on=!(AU.musOn||AU.sfxOn);AU.setMusic(on);AU.setSfx(on);$('#b-snd').style.opacity=on?1:0.4;};

addEventListener('resize',()=>{layout();if(targeting>=0)showTarget($('#target')&&$('#target').textContent);});

Object.defineProperties(T,{game:{get:()=>G},busy:{get:()=>busy},board:{get:()=>({bx,by,ts})},targeting:{get:()=>targeting},hint:{get:()=>hintMv}});
Object.assign(T,{_art:()=>({ART,CAR_URL,ASSETS}),more:moreScreen,start:startLevel,swap:doSwap,booster:k=>useBooster(k),fireBooster,map,title,endScreen,intro,
 settle,cellCenter:i=>cen(i),setCell:(i,t,s)=>{G.blk[i]=null;G.cells[i]=Object.assign(G.cells[i]||{id:9e6+i},{t,s:s||0});if(!vis[G.cells[i].id]){}},
 fpsStats:()=>{const a=T.fps.slice(30);if(!a.length)return null;const f=a.map(d=>1/d).sort((p,q)=>p-q);const win=[];let acc=0,n=0;for(const d of a){acc+=d;n++;if(acc>=0.5){win.push(n/acc);acc=0;n=0;}}
  return{frames:a.length,median:+f[f.length>>1].toFixed(1),p5:+f[Math.floor(f.length*0.05)].toFixed(1),minWindow:win.length?+Math.min(...win).toFixed(1):null};},
 resetFps:()=>{T.fps=[];},audio:()=>AU.state,SAVE:()=>SAVE});
layout();requestAnimationFrame(frame);
const startQ=Q.get('level');if(startQ!=null){SAVE.seenStory=true;startLevel(+startQ-1);}else if(Q.get('screen')==='map'){map();}else if(Q.get('screen')==='end'){endScreen();}else title();
})();
