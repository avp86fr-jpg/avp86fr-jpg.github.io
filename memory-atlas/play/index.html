:root{--gold:#e2b964;--gold2:#f8e7b0;--ink:#0b0919;--panel:#151029;--vi:#8fe0ff;--barh:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05040c;color:#efe6d0;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.cz{font-family:'Cinzel','Trajan Pro',Georgia,serif;letter-spacing:.12em;text-transform:uppercase}
/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden;overflow:clip;flex:1 1 auto;min-height:0;background:#05040c;touch-action:none;cursor:pointer}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world>div{position:absolute;inset:0}
#bg svg,#fxsvg{width:100%;height:100%;display:block}
#bg{transition:filter 1.1s}
#actors,#ghosts,#fx{pointer-events:none}
.actor{position:absolute;aspect-ratio:1/2;transform:translateX(-50%);transition:opacity .8s}
.actor svg{width:100%;height:100%;display:block;overflow:visible}
.actor.flip svg{transform:scaleX(-1)}
.actor .bob{animation:bob 4.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:scaleY(1.012)}}
.leg{transform-box:fill-box;transform-origin:50% 0}
.walk .legL{animation:st .52s linear infinite}.walk .legR{animation:st .52s linear infinite -.26s}
.walk .bob{animation:wb .26s ease-in-out infinite}
@keyframes st{0%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}100%{transform:rotate(16deg)}}
@keyframes wb{50%{transform:translateY(-1.2%)}}
#ghosts{opacity:0;transition:opacity 1.2s;filter:grayscale(1) sepia(1) hue-rotate(155deg) saturate(4) brightness(1.5) drop-shadow(0 0 10px #7fd8ff);mix-blend-mode:screen}
#stage.vision #ghosts{opacity:.85}
#stage.vision #bg{filter:saturate(.25) hue-rotate(-20deg) brightness(.6) contrast(1.15)}
#stage.vision #actors{opacity:.28}
#stage.vision #spots{display:none}
#veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse at 50% 55%,rgba(60,170,255,.10) 0,rgba(20,60,160,.35) 60%,rgba(4,10,40,.85) 100%)}
#stage.vision #veil,#stage.vmode #veil{opacity:1}
#stage.vmode #veil{opacity:.55}
#stage.vmode #bg{filter:saturate(.6) brightness(.8)}
#fade{position:absolute;inset:0;background:#05040c;opacity:0;pointer-events:none;transition:opacity .55s}
#fade.on{opacity:1}
#scname{position:absolute;left:0;right:0;top:9%;text-align:center;font-size:clamp(15px,3.2vmin,30px);color:var(--gold2);text-shadow:0 2px 14px #000,0 0 30px rgba(226,185,100,.5);opacity:0;transition:opacity 1.2s;pointer-events:none}
#scname.on{opacity:1}
#scname small{display:block;font-size:.55em;color:#cdbfe6;letter-spacing:.3em;margin-bottom:.3em}
/* motes & fog */
.mote{position:absolute;width:.5%;aspect-ratio:1;border-radius:50%;animation:drift linear infinite;opacity:0}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}15%{opacity:var(--o)}85%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
.fog{position:absolute;left:-30%;width:160%;height:26%;background:radial-gradient(ellipse at 50% 50%,var(--fc) 0,transparent 68%);animation:fog 38s ease-in-out infinite alternate;opacity:.5}
@keyframes fog{to{transform:translateX(14%)}}
.tw{animation:tw 3.4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.flick{animation:fl .17s steps(2) infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{to{transform:scale(1.05,.93)}}
.glowp{animation:gp 3s ease-in-out infinite}@keyframes gp{50%{opacity:.72}}
.water{stroke-dasharray:7 9;animation:wa .7s linear infinite}@keyframes wa{to{stroke-dashoffset:-16}}
.shim{animation:sh 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes sh{to{transform:scaleX(1.25);opacity:.45}}
.spin{animation:sp 90s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
/* hotspots */
.spot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;z-index:3}
.spot i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold);background:radial-gradient(circle,rgba(30,20,50,.82) 55%,rgba(226,185,100,.25));box-shadow:0 0 0 0 rgba(226,185,100,.6),0 2px 8px #000;animation:pulse 2.6s ease-out infinite;display:grid;place-items:center}
.spot svg{width:14px;height:14px;stroke:var(--gold2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(226,185,100,0),0 2px 8px #000}100%{box-shadow:0 0 0 0 rgba(226,185,100,0),0 2px 8px #000}}
.spot b{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;font:600 12px 'Cinzel',serif;letter-spacing:.08em;color:var(--gold2);background:rgba(12,9,26,.9);border:1px solid rgba(226,185,100,.5);padding:3px 8px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none}
.spot.lab b,.spot:hover b{opacity:1}
#stage.vmode .spot i{border-color:#456;opacity:.35;animation:none}
#stage.vmode .spot.mem i{border-color:var(--vi);opacity:1;box-shadow:0 0 16px 3px rgba(127,216,255,.75);background:radial-gradient(circle,rgba(10,40,70,.9) 50%,rgba(127,216,255,.4))}
#stage.vmode .spot.mem svg{stroke:var(--vi)}
#stage.busy .spot{opacity:0;pointer-events:none}
.spot{transition:opacity .3s}
/* dialogue */
#dlg{position:relative;background:linear-gradient(#17112d,#0d0a1d);border-top:1px solid rgba(226,185,100,.45)}
#talk{display:none;gap:14px;padding:14px 16px;align-items:flex-start;height:100%}
#dlg.on #talk{display:flex}#dlg.on #idle{display:none}
#port{flex:0 0 auto;width:clamp(64px,17vmin,104px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 0 3px #0b0919,0 0 0 4px rgba(226,185,100,.4),0 6px 18px #000;background:radial-gradient(circle at 40% 35%,#3a2f66,#141026)}
#port:empty{display:none}#port svg{width:100%;height:100%;display:block}
#tx{flex:1;min-width:0;display:flex;flex-direction:column;max-height:100%}
#who{font-size:13px;color:var(--gold);margin-bottom:4px;font-weight:700}
#who:empty{display:none}
#line{font-size:clamp(18px,2.5vmin + 9px,25px);line-height:1.32;font-weight:500;min-height:2.6em;overflow-y:auto}
#dlg.narr #line{font-style:italic;color:#dcd3ee}
#dlg.vis #line{font-style:italic;color:#c4ecff;text-shadow:0 0 18px rgba(127,216,255,.45)}
#dlg.vis{background:linear-gradient(#0d1e3d,#071026);border-top-color:rgba(127,216,255,.6)}
#more{align-self:flex-end;color:var(--gold);font-size:13px;animation:tw 1.2s infinite;margin-top:2px}
#choices{display:flex;flex-direction:column;gap:7px;margin-top:6px;overflow-y:auto}
#choices button{text-align:left;padding:9px 13px;border:1px solid rgba(226,185,100,.4);border-radius:4px;background:rgba(226,185,100,.07);font-size:clamp(16px,2vmin + 9px,21px);line-height:1.2}
#choices button:active,#choices button:hover{background:rgba(226,185,100,.22)}
#choices button::before{content:'◆ ';color:var(--gold);font-size:.7em;vertical-align:middle}
#idle{padding:18px 20px;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px}
#idle .loc{color:var(--gold2);font-size:17px}
#idle .rule{width:150px;height:10px;opacity:.8}
#idle .thr{font-size:20px;font-style:italic;color:#d8cfea;max-width:30em;line-height:1.3}
#idle .tip{font-size:14px;color:#8f86ad;margin-top:6px}
/* bar */
#bar{flex:0 0 var(--barh);height:var(--barh);display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#1b1434,#0c0919);border-top:1px solid rgba(226,185,100,.55);box-shadow:0 -6px 20px rgba(0,0,0,.6);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.rb{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#3a2d63,#130e26)}
.rb svg{width:22px;height:22px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb:disabled{opacity:.28}
#bEye.on{border-color:var(--vi);box-shadow:0 0 18px 4px rgba(127,216,255,.7);background:radial-gradient(circle,#1b5a86,#0a1c36)}
#bEye.on svg{stroke:#dff6ff}
#bEye.new{animation:pulse 1.4s ease-out infinite}
#inv{flex:1;display:flex;gap:7px;overflow-x:auto;height:50px;align-items:center;padding:0 8px;border:1px solid rgba(226,185,100,.3);border-radius:25px;background:rgba(0,0,0,.35);scrollbar-width:none}
#inv:empty::after{content:'Satchel';color:#5d5578;font:600 11px 'Cinzel',serif;letter-spacing:.2em;margin:auto;text-transform:uppercase}
.it{flex:0 0 42px;width:42px;height:42px;border-radius:7px;border:1px solid transparent;display:grid;place-items:center}
.it svg{width:34px;height:34px}
.it.arm{border-color:var(--gold);background:rgba(226,185,100,.2);box-shadow:0 0 12px rgba(226,185,100,.6)}
.it.pop{animation:pop .7s}@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.35)}}
#toast{position:absolute;left:50%;bottom:calc(var(--barh) + 10px);transform:translateX(-50%);background:rgba(12,9,26,.95);border:1px solid var(--gold);color:var(--gold2);padding:7px 14px;border-radius:4px;font:600 12px 'Cinzel',serif;letter-spacing:.1em;opacity:0;transition:opacity .35s;pointer-events:none;z-index:9;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1}
/* layout */
@media (orientation:portrait){#stage{flex:0 0 56%}.spot i{width:22px;height:22px}.spot svg{width:12px;height:12px}#dlg{flex:1 1 0;min-height:0}}
@media (orientation:landscape){
 #dlg{position:absolute;left:50%;transform:translateX(-50%);width:min(900px,96vw);top:8px;border:1px solid rgba(226,185,100,.55);border-radius:8px;box-shadow:0 10px 40px #000;display:none;z-index:6;max-height:62vh}
 #dlg.on{display:block}#talk{padding:10px 14px}#line{min-height:1.3em}#port{width:clamp(56px,15vmin,96px)}#dlg{background:linear-gradient(rgba(23,17,45,.94),rgba(13,10,29,.94))}
 #choices{max-height:50vh}
}
/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
.ov.on{display:flex}
#title{background:#070614;overflow:hidden}
#title .art{position:absolute;inset:0}#title .art svg{width:100%;height:100%}
#title .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.logo{font-family:'Cinzel',serif;font-weight:700;line-height:.92;font-size:clamp(40px,11vmin,110px);letter-spacing:.04em;background:linear-gradient(#fff3c4 10%,#e2b964 48%,#a8742a 78%,#f2d58c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(0,0,0,.9)) drop-shadow(0 0 30px rgba(226,185,100,.35))}
.logo small{display:block;font-size:.34em;letter-spacing:.5em;font-weight:500}
.sub{font-size:clamp(11px,2.2vmin,17px);color:#e9dcc0;letter-spacing:.34em;margin:10px 0 26px;text-shadow:0 2px 8px #000}
.btn{font-family:'Cinzel',serif;letter-spacing:.2em;text-transform:uppercase;font-size:15px;font-weight:700;padding:13px 34px;border:1.5px solid var(--gold);border-radius:3px;color:var(--gold2);background:linear-gradient(rgba(60,44,100,.85),rgba(20,14,40,.9));box-shadow:0 6px 24px rgba(0,0,0,.7),inset 0 0 18px rgba(226,185,100,.15);margin:5px;min-width:230px}
.btn:active{transform:translateY(1px)}.btn.ghost{border-color:rgba(226,185,100,.4);font-size:12px;padding:9px 20px;min-width:0}
#card{background:#05040c;cursor:pointer}
#card p{font-size:clamp(20px,3.4vmin + 6px,34px);line-height:1.4;max-width:24em;font-style:italic;color:#e9e0f5;opacity:0;transition:opacity 1.3s;margin:0}
#card p.on{opacity:1}#card .cz{font-style:normal;color:var(--gold2)}
#modal{background:rgba(5,4,14,.93);z-index:15;padding:12px;gap:10px}
#modal h3{margin:0;font:700 clamp(15px,3vmin,22px) 'Cinzel',serif;letter-spacing:.2em;color:var(--gold2);text-transform:uppercase}
#modal p{margin:0;font-size:clamp(16px,2.4vmin + 6px,21px);font-style:italic;color:#d8cfea;max-width:32em;min-height:1.3em}
#modal .pz{width:min(92vw,62vh,560px)}#modal .pz.wide{width:min(94vw,94vh,640px)}
#modal .pz svg{width:100%;display:block}
.pieces{display:flex;gap:10px;justify-content:center}
.pc{flex:1;max-width:190px}.pc .pap{aspect-ratio:1;border-radius:3px;box-shadow:0 6px 18px #000;transition:transform .3s;cursor:pointer;overflow:hidden}
.pc .mv{display:flex;justify-content:center;gap:10px;margin-top:8px}
.pc .mv button{width:40px;height:34px;border:1px solid rgba(226,185,100,.5);border-radius:4px;color:var(--gold2);font-size:17px}
.pips{display:flex;gap:8px;justify-content:center}.pips i{width:11px;height:11px;border-radius:50%;border:1px solid var(--gold);transition:.2s}.pips i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.ring{transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-box:view-box;transform-origin:200px 200px;cursor:pointer}
.cup{cursor:pointer}.cup.hit .cb{animation:hit .5s}@keyframes hit{30%{transform:scale(1.12)}}.cb{transform-box:fill-box;transform-origin:center}
.rip{fill:none;stroke:#bfe6ff;stroke-width:2;opacity:0}.cup.hit .rip{animation:rip .9s ease-out}@keyframes rip{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}.rip{transform-box:fill-box;transform-origin:center}
#flash{position:absolute;inset:0;background:#bfeaff;opacity:0;pointer-events:none;z-index:30;transition:opacity .9s}
#flash.on{opacity:.95;transition:opacity .12s}
#rot{display:none}

/* painted sprites */
.actor{aspect-ratio:auto;white-space:nowrap}
.actor .fl{display:block;height:100%;position:relative}
.actor .fl::before{content:'';position:absolute;left:-8%;right:-8%;bottom:-2.5%;height:7%;background:radial-gradient(ellipse,rgba(0,0,0,.6) 0,rgba(0,0,0,.25) 45%,transparent 70%)}
.actor img{height:100%;width:auto;display:block;position:relative;transform-origin:50% 100%;animation:ibob 4.4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(10,6,30,.5)) brightness(.96)}
.actor.flip .fl{transform:scaleX(-1)}
.actor.walk img{animation:wk .46s ease-in-out infinite}
@keyframes ibob{50%{transform:scaleY(1.012)}}
@keyframes wk{0%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(-1.6%) rotate(1.4deg)}100%{transform:translateY(0) rotate(-1.4deg)}}
#port img{width:100%;height:100%;object-fit:cover;display:block}
#title .art{position:absolute;inset:0}

/* ambient fill behind a pillarboxed scene */
#stage::before{content:'';position:absolute;inset:-50px;background:var(--amb,none) center/cover no-repeat;filter:blur(30px) brightness(.42) saturate(1.2)}
#world.pill{-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
/* Elias: stepping walk built from one sprite */
.pw{display:block;height:100%;position:relative;transform-origin:50% 100%;animation:ibob 4.4s ease-in-out infinite}
.actor .pw img{animation:none}
.pw .pb{clip-path:inset(0 0 17.6% 0);z-index:2}
.pw .pl,.pw .pr{position:absolute;left:0;top:0;z-index:1}
.pw .pl{clip-path:inset(81.5% 54% 0 0);transform-origin:28% 80%}
.pw .pr{clip-path:inset(81.5% 0 0 46%);transform-origin:64% 80%}
.actor.walk .pw{animation:wbody .42s ease-in-out infinite}

/* ---------- audio ---------- */
const AU={ctx:null,on:true,out:null,
 init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C();const c=this.ctx;this.out=c.createGain();this.out.gain.value=.9;this.out.connect(c.destination);
   const d=c.createDelay(1);d.delayTime.value=.42;const fb=c.createGain();fb.gain.value=.38;const wet=c.createGain();wet.gain.value=.5;this.send=c.createGain();this.send.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(this.out);
   // drone
   [73.42,110,146.83].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.type=i?'sine':'triangle';o.frequency.value=f;g.gain.value=.03;l.frequency.value=.05+i*.03;lg.gain.value=.018;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(this.out);o.start();l.start()});
   this.loop()}catch(e){this.ctx=null}},
 tone(f,dur=1.6,vol=.16,type='sine',wet=1){if(!this.ctx||!this.on)return;const c=this.ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(this.out);if(wet)g.connect(this.send);o.start(t);o.stop(t+dur+.05)},
 bell(f,vol=.2){this.tone(f,2.4,vol,'sine');this.tone(f*2.01,1.2,vol*.35,'sine');this.tone(f*3.02,.6,vol*.15,'triangle')},
 noise(dur=.5,f0=400,f1=3000,vol=.12){if(!this.ctx||!this.on)return;const c=this.ctx,t=c.currentTime,n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.3);g.gain.linearRampToValueAtTime(0,t+dur);n.connect(fl);fl.connect(g);g.connect(this.out);g.connect(this.send);n.start()},
 loop(){const sc=[293.66,349.23,392,440,523.25,587.33,698.46];let i=0;const tick=()=>{if(this.on&&this.ctx&&this.ctx.state=='running'&&!document.hidden){const n=sc[(Math.random()*sc.length)|0]*(Math.random()<.25?.5:1);this.tone(n,3.2,.035,'sine');if(Math.random()<.3)this.tone(n*1.5,2.6,.02,'sine')}setTimeout(tick,1700+Math.random()*2600)};tick()},
 pick(){this.bell(880,.1);setTimeout(()=>this.bell(1318.5,.08),110)},
 door(){this.noise(.35,200,90,.25)},
 whoosh(){this.noise(1.4,200,4200,.16);this.tone(110,2.2,.08,'triangle')},
 step(){this.tone(1046,.25,.03,'triangle',0)},
 bad(){this.tone(98,.7,.14,'sawtooth',0);this.noise(.3,300,120,.1)},
 win(){[587.33,698.46,880,1174.66].forEach((f,i)=>setTimeout(()=>this.bell(f,.14),i*170))}
};

function layout(){const st=el.stage,sw=st.clientWidth,sh=st.clientHeight;let k=sh/900;if(sw>1600*k)k=Math.min(sw/1600,k*1.06);W=1600*k;H=900*k;el.world.classList.toggle('pill',W<sw-2);el.world.style.width=W+'px';el.world.style.height=H+'px';setCam()}
function setCam(){const sw=el.stage.clientWidth,sh=el.stage.clientHeight,max=Math.max(0,W-sw);let t=camManual!=null?camManual:S.x/1600*W-sw/2;t=Math.max(0,Math.min(max,t));if(camManual!=null)camManual=t;el.world.style.transform=`translate3d(${W<sw?(sw-W)/2:-t}px,${sh-H}px,0)`}
function place(){const sc=SC[S.scene];if(!sc)return;el.elias.style.left=S.x/16+'%';el.elias.style.bottom=(900-sc.ground)/9+'%';setCam()}
function walkTo(tx){const sc=SC[S.scene];tx=Math.max(sc.minX,Math.min(sc.maxX,tx));return new Promise(res=>{const sx=S.x,d=Math.abs(tx-sx);camManual=null;if(d<6||FAST){S.x=tx;place();return res()}el.elias.classList.toggle('flip',tx<sx);el.elias.classList.add('walk');const T=d/.5,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/T);S.x=sx+(tx-sx)*k;place();if(k<1)requestAnimationFrame(step);else{el.elias.classList.remove('walk');res()}};requestAnimationFrame(step)})}
function face(x){el.elias.classList.toggle('flip',x<S.x)}

async function runSpot(sp,b){if(busy)return;script(async()=>{if(b)b.classList.add('lab');

 else{await sp.act();(S.v=S.v||{})[S.scene+':'+sp.id+':'+sp.label]=fsig()}})}

 if(!f.fountainOpen)return "The nocturne is whole again. The fountain is waiting.";

async function finale(){const f=S.f;
 await vision([],[
  "I touch the cradle, and four hundred years lean on me at once.",
  "This book was not always empty. Leaves of brass and glass, turning by themselves — and in every leaf, lights. Lives. Every memory ever lived, kept so that nothing need ever be lost.",
  "Four figures stand around it. They are weeping. One by one, they lift the leaves out, until only the binding is left.",
  "“It keeps too well,” one of them says. “It has begun to prefer its copy to the world.”",
  "THE MEMORY ATLAS. I know the name the way you know your own."]);
 f.archHere=1;render();AU.bad();await sleep(600);
 await lines([
  ['arch',"Remarkable. Twenty years I have needed a lens and a ritual to see what you see with a fingertip, Mr Vane."],
  ['mira',"You. You took the Wayfinder."],
  ['arch',"I retrieved it. There is a difference, Miss Thorne, though I don't expect a detective to care for it."],
  "People are forgetting their own names up there.",
  ['arch',"Memories are dangerous. Every war is a memory that would not lie down. Every grief. I am not destroying them. I am putting them back where they are safe — and where they can be controlled."],
  ['mira',"My father. Tobias Thorne. Did you put him somewhere safe?"],
  ['narr',"The gold mask tilts. For the first time, he seems to choose his words."],
  ['arch',"Ask Professor Ashcroft what Tobias cost him. Ask him whose hand held the door tonight."],
  ['narr',"He lifts something from his sleeve. A brass compass. Its needle spins, slows — and settles on Mira."],
  ['arch',"A demonstration. So that you understand, Mr Vane, that this is mercy and not theft."],
  "Mira —!"]);
 await flash();
 await lines([
  ['narr',"The light goes out of the needle. Mira blinks. She looks at the lantern in her hand as though someone has just handed it to her. Then at me."],
  ['mira',"…I'm sorry. Have we met?"],
  ['narr',"She looked at me the way you look at a stranger who somehow knows your name."],
  ['narr',"And in her coat pocket, a watch went on ticking, wound by nobody."]]);
 endTalk();f.ended=1;save();el.fade.classList.add('on');await sleep(900);
 await cards([`<span class="cz">End of Chapter One<br><small>The Things We Forget</small></span>`]);
 el.fade.classList.remove('on');await startCh2();
}

  function reportScore(reason){if(SCORE_SENT)return;SCORE_SENT=true;const score=computeScore();const f=(window.S||S||{}).f||{};const detail={score,reason:reason||'complete',chapter:f.ch3?3:f.ch2?2:1,flags:Object.keys(f).filter(k=>f[k]&&k.indexOf('seen_')!==0).length};try{if(typeof window.submitScore==='function')window.submitScore(score,detail)}catch(e){}try{window.postMessage({type:'game-score',...detail},'*')}catch(e){}try{window.parent&&window.parent.postMessage({type:'game-score',...detail},'*')}catch(e){}try{window.postMessage({type:'tournament-arcade:score',score},'*')}catch(e){}try{window.parent&&window.parent.postMessage({type:'tournament-arcade:score',score},'*')}catch(e){}}
  window.__atlasReportScore=reportScore;
  const _boot=boot;
  boot=function(){
    _boot();
    const fsEl=document.documentElement,btn=document.getElementById('bFs');
    const icon=(exit)=>exit
      ? '<svg viewBox="0 0 24 24"><path d="M9 9L4 4m0 0h5M4 4v5M15 9l5-5m0 0h-5m5 0v5M9 15l-5 5m0 0h5M4 20v-5M15 15l5 5m0 0h-5m5 0v-5"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>';
    const fsT=()=>{if(btn)btn.innerHTML=icon(!!(document.fullscreenElement||document.webkitFullscreenElement))};
    const goFs=()=>{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}else{(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl).catch(()=>{})}};
    if(btn){btn.onclick=e=>{e.preventDefault();e.stopPropagation();goFs()}}
    document.addEventListener('fullscreenchange',fsT);document.addEventListener('webkitfullscreenchange',fsT);fsT();
    if(/[?&]fs=1(?:&|$)/.test(location.search)){const once=()=>{goFs();document.removeEventListener('pointerdown',once,true)};document.addEventListener('pointerdown',once,true)}
    const wrap=(sel)=>{const n=document.querySelector(sel);if(!n||n.__atlasWrap)return;n.__atlasWrap=1;const old=n.onclick;n.onclick=function(e){SCORE_SENT=false;if(old)return old.call(this,e)}};
    ['#bNew','#bCont','#bCh1','#bCh2','#bCh3'].forEach(wrap);
    reportReady();
  };
  const _save=save;
  save=function(){_save();try{if(S&&S.f&&S.f.ended3)reportScore('complete')}catch(e){}};
  boot();
})();
</script></body></html>
