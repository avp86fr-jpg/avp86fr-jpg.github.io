:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sbm:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:'TSFont',Impact,'Arial Narrow',sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
a{color:#ffd21f}
.hide{display:none!important}
#loader{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#3a0606,#05070a 70%)}
#loader h1,.logo{margin:0;font-weight:400;letter-spacing:.04em;line-height:.86;background:linear-gradient(#fff,#ffd0b0 30%,#ff3b1a 62%,#7a0000);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 30px rgba(255,30,0,.55))}
#loader h1{font-size:clamp(40px,9vw,110px);text-align:center}
#loader h1 small,.logo small{display:block;font-size:.24em;letter-spacing:.38em;text-align:center;-webkit-text-fill-color:#ffd9c0;color:#ffd9c0;margin-top:.4em}
.lbar{width:min(420px,70vw);height:10px;border:2px solid #ff3b1a;border-radius:6px;margin-top:22px;overflow:hidden;background:#200400}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a00,#ff6a2a);transition:width .15s}
#ltxt{margin-top:10px;font-family:Arial,sans-serif;font-weight:700;font-size:12px;letter-spacing:.24em;color:#ff9f80}
.realbtn{position:fixed;right:calc(12px + var(--sr));top:calc(10px + var(--st));padding:8px 14px;border:2px solid #000;border-radius:8px;background:linear-gradient(#fff07a,#ffb400 50%,#ff5a00);color:#1a0700;text-decoration:none;font-size:clamp(13px,1.5vw,18px);letter-spacing:.06em;z-index:60;box-shadow:0 3px 0 #000,0 0 18px rgba(255,140,0,.55);line-height:1.05;text-align:center}
.realbtn small{display:block;font-size:.62em;letter-spacing:.1em;color:#5a1200}
body.playing .realbtn{padding:4px 9px;font-size:11px;opacity:.8;top:calc(6px + var(--st));right:calc(8px + var(--sr))}
body.playing .realbtn small{display:none}
.scr{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:12px calc(12px + var(--sr)) 12px calc(12px + var(--sl));text-align:center;background:radial-gradient(ellipse at 50% 35%,rgba(40,4,2,.25),rgba(2,3,5,.8) 75%);overflow:auto;touch-action:pan-y}
.scr.title{background:linear-gradient(90deg,rgba(2,3,5,.25),rgba(2,3,5,.55) 50%,rgba(2,3,5,.25)),radial-gradient(ellipse at 50% 40%,transparent,rgba(0,0,0,.65))}
.logo{font-size:clamp(44px,9vw,112px)}
.logo .l1,#loader h1 .l1{display:block;font-size:.4em;letter-spacing:.36em;margin-right:-.36em;line-height:1.05;background:linear-gradient(#ffffff,#c9d2dc 45%,#6d7884 55%,#e8eef4);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .l2,#loader h1 .l2{display:block;white-space:nowrap;font-style:italic;transform:skewX(-6deg)}
.logo .xo,#loader h1 .xo{display:inline-block;position:relative;width:.62em;height:.62em;margin:0 .03em;border:.085em solid #ff3b1a;border-radius:50%;box-shadow:0 0 .12em rgba(255,60,20,.9),inset 0 0 .1em rgba(255,60,20,.8);vertical-align:.02em;transform:skewX(6deg)}
.logo .xo:before,.logo .xo:after,#loader h1 .xo:before,#loader h1 .xo:after{content:"";position:absolute;background:#ffd0b0;left:50%;top:50%;transform:translate(-50%,-50%)}
.logo .xo:before,#loader h1 .xo:before{width:.06em;height:.92em}
.logo .xo:after,#loader h1 .xo:after{width:.92em;height:.06em}
.logo{padding-top:.08em}

.sub{font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,1.4vw,15px);color:#ffd0b8;letter-spacing:.06em;margin:8px 0 4px;text-shadow:0 1px 3px #000}
.sub .hs{color:#ffd21f}.nb{color:#ffd21f;font-size:clamp(14px,1.8vw,20px)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:clamp(8px,2vh,20px);max-width:900px}
.b{font-family:inherit;font-size:clamp(16px,2vw,24px);letter-spacing:.06em;padding:10px 22px;border:2px solid #ff4a2a;border-radius:9px;background:linear-gradient(#2a0805,#100302);color:#fff;cursor:pointer;box-shadow:0 4px 0 #000;text-decoration:none;display:inline-block;line-height:1.05;min-height:44px}
.b:hover{background:linear-gradient(#ff5a2a,#a01000)}
.b.gold{background:linear-gradient(#fff07a,#ffb400 50%,#ff5a00);color:#1a0700;border-color:#000;box-shadow:0 4px 0 #000,0 0 22px rgba(255,140,0,.6)}
.b span{display:block;font-size:.48em;letter-spacing:.14em;opacity:.85;font-family:Arial,sans-serif;font-weight:700}
.b.big1{font-size:clamp(24px,3.4vw,40px);padding:10px 40px}
.realcta{display:inline-block;margin-top:12px;padding:10px 20px;border:2px solid #000;border-radius:10px;background:linear-gradient(#fff07a,#ffb400 50%,#ff5a00);color:#1a0700;text-decoration:none;font-size:clamp(17px,2.4vw,28px);letter-spacing:.05em;box-shadow:0 4px 0 #000,0 0 30px rgba(255,120,0,.6);animation:pulse 1.6s infinite;line-height:1.05}
.realcta span{display:block;font-size:.5em;letter-spacing:.12em;color:#5a1200}
@keyframes pulse{50%{transform:scale(1.04)}}
.shareX{display:inline-block;padding:9px 14px;border-radius:8px;background:#000;border:2px solid #fff;color:#fff;text-decoration:none;font-size:clamp(13px,1.6vw,18px);letter-spacing:.06em;min-height:44px}
.mgx{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;margin-top:clamp(8px,1.8vh,16px);max-width:96vw}
.mgx-h{font-size:clamp(11px,1.25vw,14px);letter-spacing:.16em;color:#ffd21f;text-shadow:0 2px 0 #000;white-space:nowrap}
.mgx a.mgx-c{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:2px solid rgba(255,190,40,.85);border-radius:7px;background:rgba(10,4,0,.74);color:#fff;text-decoration:none;font-size:clamp(11px,1.2vw,14px);letter-spacing:.05em;box-shadow:0 3px 0 #000}
.mgx a.mgx-c img{width:clamp(34px,4.4vw,50px);height:auto;border-radius:4px;display:block}
.mgx a.mgx-c:hover{background:#ffb000;color:#120600}
.mgx-rate{margin-top:clamp(6px,1.4vh,12px);font-family:Arial,sans-serif;font-weight:700;font-size:clamp(11px,1.3vw,14px);color:#ffe7a6;text-shadow:0 1px 3px #000}
.opts{display:grid;grid-template-columns:auto auto;gap:6px 14px;align-items:center;margin-top:12px;font-size:clamp(13px,1.5vw,17px)}
.opts label{text-align:right;color:#ffb8a0;letter-spacing:.1em}
.seg{display:flex;gap:4px}
.seg button{font-family:inherit;font-size:clamp(13px,1.4vw,16px);padding:6px 12px;min-height:36px;border:2px solid #6a1a10;border-radius:6px;background:#140403;color:#fff;cursor:pointer;letter-spacing:.06em}
.seg button.on{background:#ff3b1a;border-color:#ffb090}
.ctl{font-family:Arial,sans-serif;font-weight:700;font-size:clamp(10px,1.15vw,13px);color:#ffe2d0;line-height:1.55;max-width:720px;margin-top:10px;text-align:left;columns:2;column-gap:28px;text-shadow:0 1px 2px #000}
.ctl b{display:inline-block;min-width:92px;color:#ff6a3a;font-family:'TSFont',Impact,sans-serif;font-weight:400;letter-spacing:.06em}
.big{font-size:clamp(34px,6vw,72px);line-height:1;letter-spacing:.04em;text-shadow:0 4px 0 #000}.big.red{color:#ff3b1a}.big.cd{font-size:clamp(50px,10vw,120px);color:#ffd21f}
.rhead{display:flex;align-items:center;gap:24px}
.grade{font-size:clamp(60px,10vw,120px);line-height:.9;width:1.2em;border:4px solid currentColor;border-radius:12px;color:#ffd21f;text-shadow:0 0 30px currentColor}
.grade.stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) 1.45s both}@keyframes stamp{0%{opacity:0;transform:scale(2.6) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(-4deg)}}
.grade small{display:block;font-size:.14em;letter-spacing:.3em;color:#fff;text-shadow:none;padding-bottom:6px}
.grade.gS{color:#ff3bd0}.grade.gA{color:#ffd21f}.grade.gB{color:#4fd0ff}.grade.gC{color:#9f9}.grade.gD{color:#aaa}
.stats{display:grid;grid-template-columns:auto auto auto auto;gap:3px 18px;font-size:clamp(14px,1.7vw,20px);margin-top:8px;text-align:left}
.stats span:nth-child(odd){color:#ffb8a0;font-family:Arial,sans-serif;font-weight:700;font-size:.66em;letter-spacing:.14em;align-self:center;text-align:right}
.join{margin-top:12px;padding:10px 18px;border:2px solid rgba(255,180,0,.6);border-radius:10px;background:rgba(30,8,0,.6)}
.jh{font-size:clamp(16px,2.2vw,26px);letter-spacing:.05em;color:#ffd21f}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hl{position:absolute;left:calc(12px + var(--sl));top:calc(8px + var(--st));display:flex;flex-direction:column;gap:3px}
#score{font-size:clamp(20px,2.6vw,32px);letter-spacing:.05em;text-shadow:0 3px 0 #000;line-height:1}
#lives{display:flex;gap:4px}#lives i{width:16px;height:16px;background:#ff3b1a;clip-path:polygon(50% 100%,0 35%,15% 5%,50% 22%,85% 5%,100% 35%);filter:drop-shadow(0 0 4px #f00)}
#combo{font-size:clamp(13px,1.5vw,18px);color:#ffd21f;letter-spacing:.06em;text-shadow:0 2px 0 #000}
#timer{position:absolute;left:50%;top:calc(4px + var(--st));transform:translateX(-50%);font-size:clamp(34px,4.8vw,58px);line-height:1;color:#fff;text-shadow:0 3px 0 #000,0 0 18px rgba(255,255,255,.3);padding:2px 16px;border-bottom:3px solid #ff3b1a;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0))}
#timer small{font-size:.5em}#timer.warn{color:#ff3b1a;animation:blink .5s infinite}
#ar{position:absolute;right:calc(14px + var(--sr));bottom:calc(10px + var(--sbm));text-align:right}
#wname{font-size:clamp(14px,1.7vw,20px);letter-spacing:.08em;text-shadow:0 2px 0 #000;color:#ffd9b0}
#ammo{display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:3px;max-width:220px;margin-top:4px}
#ammo i{width:7px;height:22px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#b07a20,#ffd27a 45%,#9a6010);box-shadow:0 1px 0 #000}
#ammo i.sh{width:11px;height:20px;background:linear-gradient(90deg,#8a1010,#ff5a3a 45%,#700)}#ammo i.gr{width:14px;height:20px;border-radius:7px;background:linear-gradient(90deg,#3a4a2a,#8aa060 45%,#2a3a1a)}
#ammo i.e{opacity:.18;filter:grayscale(1)}#ammo.low i{animation:blink .4s infinite}
