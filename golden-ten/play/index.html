<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Golden Ten</title>
<style>
:root{--gold:#ffcf4a;--gold2:#ff9a1f;--ink:#0a1034}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1034;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.ov.on{display:flex}
#title{justify-content:flex-start;padding:0 0 3vh;background:radial-gradient(130% 70% at 50% 0,#2a5fd0,#0a1034 72%)}
.art{flex:none;width:min(100%,58vh,560px);aspect-ratio:1199/1312;background:url(cover.jpg) center/cover;-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-7vh;position:relative}
.menu .row .btn{min-width:142px}
.card{animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.stars{font-size:30px;letter-spacing:.12em;color:var(--gold);text-shadow:0 2px 0 #7a3a00;line-height:1}
.lvl{appearance:none;border:0;font:inherit;color:#fff;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:13px 14px;margin:5px 0;border-radius:14px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);touch-action:manipulation}
.lvl:active{background:rgba(255,207,74,.35)}.lvl b{font-style:italic;font-weight:900;font-size:19px}.lvl small{grid-column:1;font-size:13.5px;opacity:.8}.lvl em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:26px;font-weight:900;color:var(--gold)}
.tbl .me{background:rgba(255,207,74,.18);border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,207,74,.5)}
.tbl i{font-style:normal;font-size:11px;opacity:.6;letter-spacing:.08em}.tbl .up{color:#2fd17a;font-size:11px}.tbl .dn{color:#ff5d5d;font-size:11px}
.tbl .sep{justify-content:center;color:var(--gold);font-size:12px;letter-spacing:.3em;padding-top:12px}
.grid button small{display:block;font-style:normal;font-weight:600;font-size:11.5px;opacity:.7;margin-top:2px}
#pauseB{position:fixed;top:8px;right:8px;z-index:5;width:40px;height:40px;border-radius:50%;border:0;background:rgba(6,10,40,.55);color:#fff;font-weight:900;font-size:15px;display:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);touch-action:manipulation}
#pause .btn{min-width:220px}
.kicker{font-weight:700;letter-spacing:.42em;font-size:13px;color:#fff;opacity:.92;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.logo{font-style:italic;font-weight:900;line-height:.86;font-size:min(21vw,15vh,120px);letter-spacing:-.02em;transform:skewX(-6deg);
background:linear-gradient(180deg,#fff6c9 0%,#ffd75a 38%,#ff9a1f 62%,#ffe58a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 0 #7a3a00) drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.logo small{display:block;font-size:.44em;letter-spacing:.14em}
.tag{margin:12px 0 0;font-weight:700;font-size:min(3.6vw,15px);letter-spacing:.1em;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-style:italic;font-weight:900;font-size:21px;letter-spacing:.05em;color:#3a1c00;padding:14px 30px;border-radius:16px;min-width:230px;
background:linear-gradient(180deg,#fff0a8,#ffcf4a 45%,#ff9a1f);box-shadow:0 5px 0 #a45a00,0 14px 26px rgba(0,0,0,.4);margin:6px;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a45a00,0 8px 16px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.best{margin-top:14px;font-size:14px;letter-spacing:.14em;opacity:.9;font-weight:700}
.card{width:min(92vw,430px);max-height:92vh;display:flex;flex-direction:column;border-radius:24px;padding:20px 20px 16px;
background:linear-gradient(180deg,rgba(18,28,82,.93),rgba(8,12,44,.95));box-shadow:0 0 0 1px rgba(255,255,255,.14),0 24px 70px rgba(0,0,0,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dim{background:rgba(4,8,30,.45)}
.eyebrow{font-size:12px;letter-spacing:.3em;font-weight:700;color:var(--gold)}
h2{font-style:italic;font-weight:900;font-size:38px;margin:4px 0 10px;line-height:1;letter-spacing:.01em}
.tips{list-style:none;margin:6px 0 14px;padding:0;text-align:left}
.tips li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.1);font-size:16.5px;line-height:1.25;font-weight:500}
.chip{flex:none;min-width:74px;text-align:center;font-weight:900;font-style:italic;font-size:13px;letter-spacing:.06em;padding:6px 8px;border-radius:999px}
.chip.r{background:#2fd17a;color:#04321a}.chip.a{background:#ff5d5d;color:#3d0000}.chip.i{background:rgba(255,255,255,.16)}
.mark{font-style:italic;font-weight:900;font-size:60px;line-height:1;margin:6px 0 2px}
.pts{font-weight:900;font-style:italic;font-size:30px;color:var(--gold)}
.sub{font-size:14px;opacity:.82;letter-spacing:.08em;font-weight:600;margin:4px 0 12px}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.row .btn{min-width:130px;font-size:18px;padding:12px 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.grid button{appearance:none;border:0;font:inherit;font-weight:800;font-style:italic;font-size:15px;color:#fff;padding:12px 6px;border-radius:12px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);touch-action:manipulation}
.grid button:active{background:rgba(255,207,74,.35)}
.tbl{overflow:auto;touch-action:pan-y;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.tbl div{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;border-top:1px solid rgba(255,255,255,.1);font-size:15.5px;font-weight:600}
.tbl div span:nth-child(2){margin-left:auto;opacity:.85}
.tbl div span:nth-child(3){width:54px;text-align:right;color:var(--gold);font-weight:900}
#mute,#fxB{position:fixed;top:10px;right:10px;z-index:5;width:40px;height:40px;border-radius:50%;border:0;background:rgba(6,10,40,.6);color:#fff;font-size:17px;font-weight:900;display:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}#fxB{right:58px;font-size:12px}#fs{position:fixed;top:10px;right:106px;z-index:40;width:40px;height:40px;border-radius:50%;border:0;background:rgba(6,10,40,.6);color:#fff;font-size:18px;font-weight:900;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.tbl{min-height:0;flex:0 1 auto}
@media (orientation:landscape) and (max-height:520px){
 #title{flex-direction:row;padding:0} .art{height:100%;width:auto;-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent)} .menu{margin:0} .stars{font-size:22px} #result .tbl{columns:2;column-gap:14px} .card{width:min(92vw,640px);padding:14px 18px 12px}
 h2{font-size:28px;margin:2px 0 6px} .tips li{padding:6px 0;font-size:15px} .mark{font-size:44px} .grid{grid-template-columns:repeat(5,1fr)}
 #final .tbl{columns:2} .btn{padding:10px 24px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Music">♪</button><button id="fxB" aria-label="Sound effects">FX</button><button id="fs" aria-label="Full screen">⛶</button>

<div class="ov on" id="title">
  <div class="art" role="img" aria-label="Golden Ten"></div>
  <div class="menu">
    <button class="btn" id="bComp">COMPETITION</button>
    <div class="row"><button class="btn ghost" id="bStart">SOLO RUN</button><button class="btn ghost" id="bPrac">PRACTICE</button></div>
    <div class="best" id="bestLine"></div>
    <div class="row" style="margin-top:8px;gap:10px">
      <a href="https://avp86fr-jpg.github.io/" style="font:800 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#cfefff;border:1px solid rgba(120,170,255,.55);padding:8px 12px;border-radius:999px;background:rgba(6,18,46,.75)">More games</a>
      <a href="https://tournament.com/@avpnft1" target="_blank" rel="noopener sponsored" style="font:800 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#35e0ff;border:1px solid rgba(53,224,255,.55);padding:8px 12px;border-radius:999px;background:rgba(6,18,46,.75)">Tournament</a>
    </div>
  </div>
</div>
<button id="pauseB" aria-label="Pause">II</button>

<div class="ov dim" id="comp"><div class="card">
  <div class="eyebrow">COMPETITION · 8 ATHLETES · 10 EVENTS</div><h2>CHOOSE YOUR MEET</h2>
  <div id="lvls"></div>
  <div class="row"><button class="btn ghost" id="bCompBack">BACK</button></div>
</div></div>

<div class="ov dim" id="pause"><div class="card">
  <div class="eyebrow">PAUSED</div><h2 id="pName"></h2>
  <div class="row" style="flex-direction:column;align-items:center"><button class="btn" id="bResume">RESUME</button><div class="row"><button class="btn ghost" id="pMus" style="min-width:126px;font-size:15px">MUSIC ON</button><button class="btn ghost" id="pFx" style="min-width:126px;font-size:15px">SOUND ON</button></div><button class="btn ghost" id="bRestart">RESTART EVENT</button><button class="btn ghost" id="bQuit">QUIT TO MENU</button></div>
</div></div>

<div class="ov dim" id="prac"><div class="card">
  <div class="eyebrow">PRACTICE</div><h2>PICK AN EVENT</h2>
  <div class="grid" id="pgrid"></div>
  <div class="row"><button class="btn ghost" id="bPracBack">BACK</button></div>
</div></div>

<div class="ov dim" id="intro"><div class="card">
  <div class="eyebrow" id="iEye"></div><h2 id="iName"></h2><div class="sub" id="iHeat" style="margin:-4px 0 6px"></div>
  <ul class="tips" id="iTips"></ul>
  <div class="row"><button class="btn" id="bGo">GO!</button></div>
</div></div>

<div class="ov dim" id="result"><div class="card">
  <div class="eyebrow" id="rEye"></div>
  <div class="mark" id="rMark"></div>
  <div class="stars" id="rStars"></div>
  <div class="pts" id="rPts"></div>
  <div class="sub" id="rPB" style="margin:2px 0 0"></div>
  <div class="sub" id="rSub"></div>
  <div class="tbl" id="rTbl"></div>
  <div class="row" id="rBtns"></div>
</div></div>

<div class="ov dim" id="final"><div class="card">
  <div class="eyebrow">FINAL STANDINGS</div>
  <h2 id="fRank"></h2>
  <div class="tbl" id="fTbl"></div>
  <div class="mark" id="fTot" style="font-size:52px"></div>
  <div class="sub" id="fSub"></div>
  <div class="row"><button class="btn" id="bAgain">PLAY AGAIN</button><button class="btn ghost" id="bMenu">MENU</button></div>
</div></div>

<script>
'use strict';
/* ============================================================
   GOLDEN TEN — a tiny decathlon.  Two inputs: RUN (tap) + ACTION.
   ============================================================ */
const $=s=>document.querySelector(s);
const cv=$('#c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t);
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const FONT='"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif';
const F=(px,w)=>`italic ${w||900} ${Math.round(px)}px ${FONT}`;

/* ---------- events ---------- */
const EVENTS=[
 {id:'100m',name:'100 METRES',type:'race',D:100,K:1,cap:11,a:1.1,cpu:[9.7,9.2],theme:0,zoom:1,
  tips:[['r','RUN','Tap as fast as you can'],['a','ACTION','Lean into the finish line']]},
 {id:'lj',name:'LONG JUMP',type:'lj',theme:1,zoom:1,
  tips:[['r','RUN','Tap to sprint down the runway'],['a','ACTION','Hold at the board, release near 45°'],['i','3 TRIES','Step past the board and it\'s a foul']]},
 {id:'sp',name:'SHOT PUT',type:'throw',kind:'shot',theme:2,zoom:1,
  tips:[['r','RUN','Tap to build power'],['a','ACTION','Hold, release near 45° before the board'],['i','3 TRIES','Best throw counts']]},
 {id:'hj',name:'HIGH JUMP',type:'bar',kind:'hj',theme:3,zoom:.9,
  tips:[['r','RUN','Tap to run at the bar'],['a','ACTION','Hold in the gold zone, release when the angle is in the green'],['i','3 MISSES','and you\'re out']]},
 {id:'400m',name:'400 METRES',type:'race',D:400,K:2,cap:10.2,a:1.5,st:{vc:7.6,kd:.035},cpu:[8.45,8.1],theme:4,zoom:1,
  tips:[['r','RUN','Tap to run — but watch your STAMINA'],['i','PACE','Empty the tank and you\'ll crawl'],['a','ACTION','Lean into the finish line']]},
 {id:'110h',name:'110M HURDLES',type:'race',D:110,K:1,cap:9.3,a:1.1,hurdles:1,cpu:[8.3,7.9],theme:0,zoom:.85,
  tips:[['r','RUN','Tap to sprint'],['a','ACTION','Jump each hurdle — clip one and you slow down']]},
 {id:'dt',name:'DISCUS THROW',type:'throw',kind:'disc',theme:1,zoom:1,
  tips:[['r','RUN','Tap to spin faster'],['a','ACTION','Press when the needle is in the green, hold, release near 45°'],['i','3 TRIES','Miss the green and it hits the cage']]},
 {id:'pv',name:'POLE VAULT',type:'bar',kind:'pv',theme:3,zoom:.72,
  tips:[['r','RUN','Tap to sprint with the pole'],['a','ACTION','Hold when you reach the gold zone to plant the pole'],['a','ACTION','Release at the top of the swing (green on the meter)']]},
 {id:'jt',name:'JAVELIN THROW',type:'throw',kind:'jav',theme:4,zoom:.95,
  tips:[['r','RUN','Tap to sprint'],['a','ACTION','Hold before the line, release near 45°'],['i','3 TRIES','Cross the line and it\'s a foul']]},
 {id:'1500',name:'1500 METRES',type:'race',D:1500,K:5,cap:8.2,a:.95,aBeat:1.75,rhythm:.42,st:{vc:5.6,kd:.03},cpu:[5.75,5.5],theme:5,zoom:1,
  tips:[['r','RUN','Tap ON THE BEAT for long, easy strides'],['i','STAMINA','Mashing is faster but burns you out'],['a','ACTION','Lean into the finish line']]},
];
/* real decathlon scoring tables */
const SC={'100m':[25.4347,18,1.81,'t'],lj:[.14354,220,1.4,'c'],sp:[51.39,1.5,1.05,'m'],hj:[.8465,75,1.42,'c'],'400m':[1.53775,82,1.81,'t'],
 '110h':[5.74352,28.5,1.92,'t'],dt:[12.91,4,1.1,'m'],pv:[.2797,100,1.35,'c'],jt:[10.14,7,1.08,'m'],'1500':[.03768,480,1.85,'t']};
function points(id,m){if(!m)return 0;const[A,B,C,k]=SC[id];const d=k==='t'?B-m:k==='c'?m*100-B:m-B;return d>0?Math.floor(A*Math.pow(d,C)):0}
function fmtTime(t){return t<60?t.toFixed(2):Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0')}
function fmtMark(ev,m){if(!m)return'NO MARK';return ev.type==='race'?fmtTime(m):m.toFixed(2)+' m'}

/* ---------- global state ---------- */
const G={paused:false,cheerT:0,level:0,rivals:[],heat:null,pos:1,screen:'title',mode:'deca',idx:0,ev:EVENTS[4],results:[],C:null,t:0,cam:{x:0},pops:[],parts:[],shake:0,flash:0,snap:true};
const AG={on:false,a:0,d:1,lo:10,hi:85,z0:38,z1:52,t:0,rate:100};
const btn={run:0,act:0,beat:0};
let W=0,H=0,DPR=1,ppm=40,gy=0,portrait=true,yT=0,yB=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);portrait=H>W;
  const z=portrait?(G.ev.zoom||1):Math.min(1,(G.ev.zoom||1)+.15);
  ppm=Math.max(20,Math.min(W/8.5,H/10.5))*z;
  gy=Math.round(H*(portrait?.63:.72));yT=gy-1.38*ppm;yB=gy+.42*ppm;
}
const X=x=>(x-G.cam.x)*ppm,Y=y=>gy-y*ppm;
const viewW=()=>W/ppm;

/* ---------- audio: effects, crowd bed and a small step-sequencer for the music ---------- */
let AC=null,master=null,sfxG=null,musG=null,crowdG=null,NOISE=null;
function lsGet(ns,old){try{const v=localStorage.getItem(ns);if(v!=null)return v;const o=localStorage.getItem(old);if(o!=null){try{localStorage.setItem(ns,o)}catch(e){}return o}}catch(e){}return null}
function lsSet(ns,val){try{localStorage.setItem(ns,val)}catch(e){}}
const OPT=(()=>{const o={mus:1,sfx:1};try{Object.assign(o,JSON.parse(lsGet('golden-ten:opt','goldenten.opt')||'{}'))}catch(e){}return o})();
function applyOpt(){
  if(AC){const t=AC.currentTime;sfxG.gain.setTargetAtTime(OPT.sfx?.9:0,t,.03);musG.gain.setTargetAtTime(OPT.mus?.55:0,t,.03)}
  for(const[id,k,l]of[['#mute','mus',''],['#fxB','sfx',''],['#pMus','mus','MUSIC'],['#pFx','sfx','SOUND']]){const b=$(id);if(!b)continue;b.style.opacity=OPT[k]?1:.4;if(l)b.textContent=l+(OPT[k]?' ON':' OFF')}
  try{lsSet('golden-ten:opt',JSON.stringify(OPT))}catch(e){}
}
function audioInit(){
  if(AC){if(AC.state==='suspended'&&!G.paused)AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const cmp=AC.createDynamicsCompressor();cmp.connect(AC.destination);master=AC.createGain();master.gain.value=.85;master.connect(cmp);
    sfxG=AC.createGain();sfxG.connect(master);musG=AC.createGain();musG.connect(master);
    const n=AC.sampleRate*2;NOISE=AC.createBuffer(1,n,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    crowdG=AC.createGain();crowdG.gain.value=.05;crowdG.connect(sfxG);
    for(const[fc,q,g,r]of[[520,.5,1,.7],[1700,.7,.35,1.1]]){const b=AC.createBufferSource();b.buffer=NOISE;b.loop=true;b.playbackRate.value=r;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=q;const v=AC.createGain();v.gain.value=g;b.connect(f);f.connect(v);v.connect(crowdG);b.start()}
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.23;lg.gain.value=.012;lfo.connect(lg);lg.connect(crowdG.gain);lfo.start();
    applyOpt();
  }catch(e){AC=null}
}
function tone(f,d,type,g,slide,when,dest){if(!AC)return;try{const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+(when||0);o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(g||.15,t+.008);v.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(v);v.connect(dest||sfxG);o.start(t);o.stop(t+d+.03)}catch(e){}}
function burst(d,g,fc,type,when,q,dest,sweep){if(!AC)return;try{const b=AC.createBufferSource(),t=AC.currentTime+Math.max(0,when||0);b.buffer=NOISE;const f=AC.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(fc||2000,t);if(sweep)f.frequency.exponentialRampToValueAtTime(fc*sweep,t+d);f.Q.value=q||.7;
  const v=AC.createGain();v.gain.setValueAtTime(g||.3,t);v.gain.exponentialRampToValueAtTime(.0008,t+d);b.connect(f);f.connect(v);v.connect(dest||sfxG);b.start(t,Math.random());b.stop(t+d+.03)}catch(e){}}
const sfx={
  tap(){},step(){burst(.05,.09,420)},ui(){tone(520,.06,'triangle',.08,1.5)},
  beep(){tone(700,.16,'square',.06)},
  gun(){burst(.35,.8,3200);burst(.5,.22,900,'lowpass',.1);tone(110,.25,'sine',.35,.4)},
  jump(){tone(280,.2,'sine',.13,2.3)},whoosh(){burst(.4,.3,500,'bandpass',0,1.2,null,6)},
  land(){burst(.16,.4,520)},sand(){burst(.3,.3,2600,'highpass');burst(.15,.35,400)},thud(){tone(90,.2,'sine',.4,.5);burst(.1,.25,300)},
  tok(){tone(180,.08,'square',.12,.5);burst(.05,.2,1500,'bandpass')},
  clang(){tone(880,.5,'sine',.12);tone(1318,.4,'sine',.08);tone(2210,.25,'sine',.04)},

const LEVELS=[{n:'REGIONAL MEET',d:'A friendly field to learn against',b:620},{n:'NATIONAL CHAMPIONSHIPS',d:'Solid all-rounders, no weak events',b:760},{n:'WORLD FINAL',d:'The best ten-eventers alive',b:870}];
const GROUP={'100m':0,'110h':0,'400m':0,lj:1,hj:1,pv:1,sp:2,dt:2,jt:2,'1500':3};
function invMark(id,p){const[A,B,C,k]=SC[id],d=Math.pow(Math.max(p,1)/A,1/C);let m=k==='t'?B-d:k==='c'?(d+B)/100:d+B;if(id==='hj')m=Math.round(m/.03)*.03;if(id==='pv')m=Math.round(m*10)/10;return Math.round(m*100)/100}
function newComp(level){
  SCORE_SENT=false;G.mode='comp';G.level=level;G.results=[];const b=LEVELS[level].b,names=RIV.slice().sort(()=>Math.random()-.5);
  G.rivals=names.map((r,i)=>{const off=(3-i)*22+(Math.random()-.5)*30,aff=[0,1,2,3].map(()=>(Math.random()-.5)*110);
    const marks=EVENTS.map(e=>invMark(e.id,clamp(b+off+aff[GROUP[e.id]]+(Math.random()-.5)*90,300,1150)));
    return{name:r[0],nat:r[1],marks,pts:EVENTS.map((e,j)=>points(e.id,marks[j]))}});
  showIntro(0);
}
function standings(upto){
  const rows=G.rivals.map((r,i)=>({i,name:r.name,nat:r.nat,tot:r.pts.slice(0,upto).reduce((a,b)=>a+b,0),ev:upto?r.pts[upto-1]:0}));
  rows.push({me:1,name:'YOU',nat:'',tot:G.results.slice(0,upto).reduce((s,r)=>s+(r?r.pts:0),0),ev:upto&&G.results[upto-1]?G.results[upto-1].pts:0});
  return rows.sort((a,b)=>b.tot-a.tot||(a.me?-1:1));
}
function finishEvent(mark,extra,cpuT){
  if(G.screen!=='play')return;const ev=G.ev,pts=points(ev.id,mark),txt=fmtMark(ev,mark);
  G.results[G.idx]={mark,pts,txt};G.screen='result';Music.stop(.3);setTimeout(()=>{if(G.screen==='result'||G.screen==='final'||G.screen==='intro')Music.play('menu')},1900);
  const pb=loadPB(),old=pb[ev.id],isPB=!!mark&&(!old||(ev.type==='race'?mark<old.m:mark>old.m));
  if(isPB){pb[ev.id]={m:mark,p:pts};try{lsSet('golden-ten:pb',JSON.stringify(pb))}catch(e){}}
  const stars=pts>=950?3:pts>=800?2:pts>=600?1:0;
  $('#rEye').textContent=ev.name+(extra?' · '+extra:'');$('#rMark').textContent=txt;$('#rStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);countUp($('#rPts'),pts,' PTS');
  $('#rPB').textContent=isPB?(old?'NEW PERSONAL BEST!':'FIRST MARK ON THE BOARD'):old?'PERSONAL BEST '+fmtMark(ev,old.m):'';$('#rPB').style.color=isPB?'#2fd17a':'';
  let sub='PRACTICE',tbl='';
  if(G.mode==='comp'){
    if(cpuT&&G.heat)G.heat.forEach((ri,j)=>{const r=G.rivals[ri];r.marks[G.idx]=Math.round(cpuT[j]*100)/100;r.pts[G.idx]=points(ev.id,r.marks[G.idx])});
    const bf=standings(G.idx),af=standings(G.idx+1),key=r=>r.me?'me':r.i,evRank=1+G.rivals.filter(r=>r.pts[G.idx]>pts).length,pos=af.findIndex(r=>r.me)+1;
    sub='EVENT RANK '+ord(evRank)+' OF 8 · OVERALL '+ord(pos);
    tbl=af.map((r,n)=>{const was=bf.findIndex(x=>key(x)===key(r)),ar=G.idx===0||was===n?'':was>n?'<b class="up">▲</b>':'<b class="dn">▼</b>';
      return`<div class="${r.me?'me':''}"><span>${n+1}. ${r.name} <i>${r.nat}</i> ${ar}</span><span>+${r.ev}</span><span>${r.tot}</span></div>`}).join('');
  }else if(G.mode==='deca')sub='TOTAL '+totalPts()+' AFTER '+(G.idx+1)+' OF 10';
  $('#rSub').textContent=sub;$('#rTbl').innerHTML=tbl;$('#rTbl').style.display=tbl?'block':'none';
  const rb=$('#rBtns');rb.innerHTML='';
  const add=(t,cls,fn)=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=t;b.onclick=fn;rb.appendChild(b)};
  if(G.mode!=='practice')add(G.idx<9?'NEXT EVENT':'FINAL RESULTS','',()=>{G.idx<9?showIntro(G.idx+1):showFinal()});
  else{add('RETRY','',()=>showIntro(G.idx));add('MENU','ghost',toTitle)}

}

/* ----- races: 100, 400, 110H, 1500 ----- */
function Race(ev){
  const K=ev.K,xf=ev.D/K,P=newAth(0),JD=.46;
  const heat=G.mode==='comp'&&G.heat?G.heat:null;
  const vts=heat?heat.map(ri=>xf*(ev.D>=1500?.981:1)/(G.rivals[ri].marks[G.idx]/K-1.02)):ev.cpu;
  P.tag='YOU';
  const cpus=vts.map((vt,i)=>Object.assign(newAth(0,KITS[i+1]),{vt,tag:heat?G.rivals[heat[i]].name.split(' ').pop():'',react:.16+Math.random()*.12,t:0,jt:-1,fin:0,wob:Math.random()*9}));
  const hur=ev.hurdles?Array.from({length:10},(_,i)=>({x:13.72+9.14*i,down:[0,0,0],passed:false})):[];
  let ph='marks',t=0,goAt=9,clock=0,done=false,fin=0,doneT=0,jt=-1,leanT=0,leaned=false,bonus=0,beatI=-1,usedBeat=-99,place=1,combo=0;
  const C={P,frac:.3,focus:()=>P.x,
    label:()=>ev.hurdles&&xf-P.x>3?'JUMP':'LEAN',tap:()=>ph==='go'&&!done,cue:()=>ph==='go'&&!done&&(xf-P.x<3||(jt<0&&hur.some(h=>!h.passed&&h.x-P.x<3.6&&h.x-P.x>.8))),
    hud:()=>({big:ph==='marks'?'ON YOUR MARKS':ph==='set'?'SET…':fmtTime(done?fin:clock*K),sub:Math.min(ev.D,Math.floor(P.x*K))+' / '+ev.D+' m',stamina:!!ev.st,prog:[P.x/xf].concat(cpus.map(c=>c.x/xf))}),
    beat:()=>ev.rhythm&&ph==='go'&&!done?{bp:ev.rhythm,clock}:null,
    onRun(){
      if(ph==='set'){ph='marks';t=0;pop('FALSE START!','#ff5d5d');sfx.fail();return}
      if(ph!=='go'||done)return;let a=ev.a;
      if(ev.rhythm){const bi=Math.round(clock/ev.rhythm),d=Math.abs(clock-bi*ev.rhythm);
        if(d<.095&&bi!==usedBeat){usedBeat=bi;a=ev.aBeat;P.st=Math.min(1,P.st+.008);btn.beat=1;combo++;sfx.perfect();if(combo%8===0)pop('IN THE GROOVE ×'+combo,'#2fd17a')}else combo=0}
      if(P.wind>0)a*=.35;P.v=Math.min(ev.cap,P.v+a);
    },
    onAct(dn){
      if(!dn||ph!=='go'||done)return;const rem=xf-P.x;
      if(ev.hurdles&&rem>3){if(jt<0){jt=0;P.v*=.95;sfx.jump()}return}
      if(leaned||leanT>0)return;
      if(rem<=3){leaned=true;leanT=.6;bonus=.03+.07*(1-rem/3);pop('LEAN!','#ffcf4a')}else{leanT=.5;P.v*=.8;pop('TOO EARLY!','#ff5d5d')}
    },
    update(dt){
      t+=dt;
      if(ph==='marks'&&t>1.3){ph='set';goAt=t+.9+Math.random()*.9;sfx.beep()}
      else if(ph==='set'&&t>=goAt){ph='go';sfx.gun();Music.play('event',ev.rhythm?60/ev.rhythm:0);pop('GO!','#2fd17a',1)}
      if(ph!=='go'){setPose(P,ev.D>=1500?POSE.idle:ph==='set'?POSE.set:POSE.marks,dt,10);for(const c of cpus)setPose(c,ev.D>=1500?POSE.idle:ph==='set'?POSE.set:POSE.marks,dt,10);return}
      if(!done)clock+=dt;const px=P.x,pp=Math.floor(P.phase/Math.PI);runPhys(P,dt);if(P.v>5&&jt<0&&Math.floor(P.phase/Math.PI)!==pp)puff(P.x-.25,0,2,'rgba(255,228,210,.55)',1.3,.9);
      if(jt>=0){jt+=dt;const u=jt/JD;P.u=u;P.y=1.15*4*u*(1-u);if(u>=1){jt=-1;P.y=0;puff(P.x,0,4,'rgba(255,220,200,.7)',1.5)}}
      for(const h of hur)if(!h.passed&&px<h.x&&P.x>=h.x){h.passed=true;const u=jt/JD;if(!(jt>=0&&u>.1&&u<.9)){h.down[0]=1;P.v*=.5;G.shake=.3;buzz(40);pop('CLIPPED!','#ff5d5d');sfx.land()}}
      if(ev.st&&!done){const s=ev.st;if(P.v>s.vc)P.st-=s.kd*Math.pow(P.v-s.vc,1.3)*dt;else P.st+=.012*dt;
        if(P.wind>0){P.wind-=dt;P.st+=.09*dt}else if(P.st<=0){P.wind=2.6;pop('EXHAUSTED!','#ff5d5d');sfx.fail()}P.st=clamp(P.st,0,1)}
      if(ev.rhythm&&!done){const bi=Math.floor(clock/ev.rhythm+.5);if(bi!==beatI){beatI=bi;sfx.beat()}}
      if(leanT>0)leanT-=dt;
      if(!done&&clock>xf/3+8){done=true;Music.stop(.4);finishEvent(0,'DID NOT FINISH',cpus.map(c=>c.fin||(clock+(xf-c.x)/Math.max(c.v,2))*K));return}
      if(!done&&P.x>=xf){done=true;Music.stop(.6);fin=Math.max(.01,(clock-(P.x-xf)/Math.max(P.v,.5))*K-bonus);fin=Math.round(fin*100)/100;
        place=1+cpus.filter(c=>c.fin&&c.fin<fin).length;pop(['1ST PLACE!','2ND PLACE','3RD PLACE'][place-1],place===1?'#ffcf4a':'#fff',1);sfx.cheer(place===1?1:.4);if(place===1)sfx.good()}
      if(done){doneT+=dt;if(doneT>2.6)finishEvent(fin,['1ST','2ND','3RD'][place-1]+' IN HEAT',cpus.map(c=>c.fin||(clock+doneT+(xf-c.x)/Math.max(c.v,2))*K))}
      const tp=done&&P.v<2?(ev.st?POSE.tired:POSE.celeb):leanT>0?runPose(P.phase,P.v,{lean:.95,ual:-1.3,fal:-1,uar:-1.1,far:-.8,n:'lean'}):jt>=0?POSE.hurdle:P.wind>0?runPose(P.phase,P.v,{lean:.5}):P.v<.3?POSE.idle:runPose(P.phase,P.v);
      setPose(P,tp,dt,done&&P.v<2?8:jt>=0?22:40);
      for(let i=0;i<cpus.length;i++){const c=cpus[i];c.t+=dt;
        let tg=c.t>c.react?c.vt*(1+.03*Math.sin(c.t*.7+c.wob)):0;if(ev.D>=1500&&c.x>xf*.86)tg*=1.16;if(c.fin)tg=0;
        c.v+=(tg-c.v)*dt/(c.fin?1.2:.8);const cx=c.x;c.x+=c.v*dt;c.phase+=(1+1.32*c.v)*dt;
        for(const h of hur)if(c.jt<0&&h.x-c.x<1.9&&h.x-c.x>1.2)c.jt=0;
        if(c.jt>=0){c.jt+=dt;const u=c.jt/JD;c.u=u;c.y=1.15*4*u*(1-u);if(u>=1){c.jt=-1;c.y=0}}

        setPose(c,c.jt>=0?POSE.hurdle:c.v<.4?POSE.idle:runPose(c.phase,c.v),dt,c.jt>=0?22:40)}
    },
    surface(){drawTrack();
      const line=(x,w,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(X(x)+.12*ppm,yT);ctx.lineTo(X(x)+.12*ppm+w,yT);ctx.lineTo(X(x)-.05*ppm+w,yB);ctx.lineTo(X(x)-.05*ppm,yB);ctx.fill()};
      line(0,.07*ppm,'#fff');

      const fxp=X(xf);if(fxp>-100&&fxp<W+100){const n=9,hh=(yB-yT)/n;for(let i=0;i<n;i++)for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#111':'#fff';const yy=yT+i*hh,sk=.17*ppm*(1-i/n);ctx.fillRect(fxp+sk-(.17*ppm/n)+j*.11*ppm,yy,.11*ppm+1,hh+1)}}

      for(let d=step;d<ev.D;d+=step){const x=X(d/K);if(x<-60||x>W+60)continue;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(d+'',x,yB-.08*ppm)}
    },
    objs(){

        ctx.fillStyle='#ffcf4a';ctx.fillRect(x-.9*ppm,yT-2.9*ppm,2.2*ppm,.5*ppm);ctx.fillStyle='#3a1c00';ctx.font=F(.34*ppm);ctx.textAlign='center';ctx.fillText('FINISH',x+.2*ppm,yT-2.54*ppm)};
      gantry();
      const lanes=[[cpus[1],-1.02,.9,2],[cpus[0],-.5,.95,1],[P,0,1,0]];
      for(const[a,ln,sc,li]of lanes){for(const h of hur)if(X(h.x)>-80&&X(h.x)<W+80)drawHurdle(h.x,ln,sc,h.down[li]);drawAth(a,ln,sc);
        if(a.tag&&a.top!==undefined){const me=a===P,tx=X(a.x),ty=a.top-.14*ppm;ctx.font=F(me?13:11,800);ctx.textAlign='center';const tw=ctx.measureText(a.tag).width+12;ctx.fillStyle=me?'#ffcf4a':'rgba(6,10,40,.7)';rr(tx-tw/2,ty-13,tw,17,8);ctx.fill();ctx.fillStyle=me?'#3a1c00':'#fff';ctx.fillText(a.tag,tx,ty)}}

function drawHurdle(x,lane,sc,down){
  const px=X(x),py=gy+lane*ppm,s=ppm*sc,h=1.0*s;
  ctx.lineCap='round';
  if(down){ctx.strokeStyle='#dfe4ee';ctx.lineWidth=.05*s;ctx.beginPath();ctx.moveTo(px,py+.22*s);ctx.lineTo(px+1.0*s,py+.16*s);ctx.moveTo(px+.12*s,py-.24*s);ctx.lineTo(px+1.1*s,py-.3*s);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(px+1.0*s,py+.2*s);ctx.lineTo(px+1.12*s,py+.2*s);ctx.lineTo(px+1.24*s,py-.3*s);ctx.lineTo(px+1.1*s,py-.3*s);ctx.fill();return}
  ctx.strokeStyle='#cfd5e2';ctx.lineWidth=.05*s;ctx.beginPath();
  ctx.moveTo(px-.45*s,py+.22*s);ctx.lineTo(px,py+.22*s);ctx.lineTo(px,py+.22*s-h);
  ctx.moveTo(px-.33*s,py-.24*s);ctx.lineTo(px+.12*s,py-.24*s);ctx.lineTo(px+.12*s,py-.24*s-h);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(px-.03*s,py+.26*s-h);ctx.lineTo(px+.04*s,py+.26*s-h-.12*s);ctx.lineTo(px+.16*s,py-.28*s-h-.1*s);ctx.lineTo(px+.1*s,py-.26*s-h+.02*s);ctx.fill();
  ctx.fillStyle='#e63950';ctx.fillRect(px+.01*s,py+.02*s-h-.07*s,.1*s,.1*s);
}

/* ----- long jump ----- */
function LongJump(ev){
  const P=newAth(-30);let ph='run',att=0,best=0,x0=0,d=0,u=0,T=1,hm=1,tt=0,res=0,last=null,marksX=[];

  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=F(h.big&&h.big.length>9?26:38);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=8;ctx.fillText(h.big||'',W/2,58);
  ctx.font=F(14,700);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillText(h.sub||'',W/2,78);ctx.shadowBlur=0;
  if(h.prog){const pw=Math.min(W-60,360),px=(W-pw)/2,py=90;ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(px,py,pw,3);ctx.fillStyle='#fff';ctx.fillRect(px+pw-2,py-5,3,13);
    h.prog.forEach((p,i)=>{ctx.fillStyle=i?KITS[i].top:'#ffcf4a';ctx.beginPath();ctx.arc(px+pw*clamp(p,0,1),py+1.5,i?4:6,0,TAU);ctx.fill();if(!i){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}})}
  if(h.timer!==null&&h.timer!==undefined){const pw=Math.min(W-80,300),px=(W-pw)/2,py=96;ctx.fillStyle='rgba(6,10,40,.6)';rr(px-3,py-3,pw+6,16,8);ctx.fill();
    if(h.tz&&G.ev.kind==='pv'){ctx.fillStyle='#2fd17a';ctx.fillRect(px+pw*h.tz[0],py,pw*(h.tz[1]-h.tz[0]),10);ctx.fillStyle='#fff';ctx.fillRect(px+pw*h.timer-2,py-4,4,18)}
    else{ctx.fillStyle=h.timer<.3?'#ff5d5d':'#fff';rr(px,py,Math.max(10,pw*h.timer),10,5);ctx.fill()}}
  // bars
  const P=C.P,wide=W-4*R-90>170,bw=wide?W-4*R-90:W-40,bx=(W-bw)/2,by2=wide?H-34:H-2*R-58;
  bar(bx,by2,bw,14,P.v/11,'#2fd17a',P.v>9.5?'#ff5d5d':'#ffe14d',h.power||'SPEED');
  if(h.stamina)bar(bx,by2-26,bw,14,P.st,P.st<.25?'#ff5d5d':'#39c5ff',P.st<.25?'#ff9a1f':'#7ff0ff',P.wind>0?'EXHAUSTED':'STAMINA');
  // buttons
  btn.run=Math.max(0,btn.run-.12);btn.act=Math.max(0,btn.act-.08);btn.beat=Math.max(0,btn.beat-.06);
  const B=(cx,cy,c1,c2,label,p,held)=>{const r=R*(1-.08*p-(held?.06:0));ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(cx,cy+5,R,0,TAU);ctx.fill();
    const gg=ctx.createRadialGradient(cx-r*.3,cy-r*.4,r*.1,cx,cy,r);gg.addColorStop(0,c1);gg.addColorStop(1,c2);ctx.fillStyle=gg;ctx.beginPath();ctx.arc(cx,cy,r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=F(r*.42);ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=4;ctx.fillText(label,cx,cy+r*.15);ctx.shadowBlur=0};
  const rx=R+20,ax=W-R-20;
  const bt=C.beat&&C.beat();
  if(bt){const fr=((bt.clock/bt.bp)%1+1)%1,tn=1-fr;ctx.strokeStyle='rgba(255,255,255,'+(.35+.6*fr)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(rx,by,R*(1+.75*tn),0,TAU);ctx.stroke();
    if(btn.beat>0){ctx.strokeStyle='rgba(47,209,122,'+btn.beat+')';ctx.lineWidth=8;ctx.beginPath();ctx.arc(rx,by,R*(1.05+.4*(1-btn.beat)),0,TAU);ctx.stroke()}}
  if(C.cue&&C.cue()&&!AG.on){const pz=.5+.5*Math.sin(G.t*14);ctx.strokeStyle='rgba(255,207,74,'+(.55+.45*pz)+')';ctx.lineWidth=6;ctx.beginPath();ctx.arc(ax,by,R*(1.1+.1*pz),0,TAU);ctx.stroke()}
  B(rx,by,'#7ff0a8','#17a35a','RUN',btn.run);B(ax,by,'#ff9a9a','#d42f45',C.label?C.label():'ACTION',btn.act,inp.actDown);
  if(C.tap&&C.tap()&&P.v<.8){const bob=Math.abs(Math.sin(G.t*6))*10,hy=(wide?by-R-16:by2-(h.stamina?50:24))-bob;ctx.font=F(22);ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='rgba(6,10,40,.8)';ctx.strokeText('TAP! TAP!',rx+8,hy);ctx.fillStyle='#fff';ctx.fillText('TAP! TAP!',rx+8,hy)}
  // angle gauge
  if(AG.on){const cx=clamp(X(P.x),70,W-ppm*2.6),cy=Y(1),r=2.3*ppm,A=d=>-d*Math.PI/180;ctx.lineCap='butt';
    ctx.strokeStyle='rgba(6,10,40,.7)';ctx.lineWidth=.42*ppm;ctx.beginPath();ctx.arc(cx,cy,r,A(90),A(0));ctx.stroke();
    ctx.strokeStyle='#2fd17a';ctx.lineWidth=.3*ppm;ctx.beginPath();ctx.arc(cx,cy,r,A(AG.z1),A(AG.z0));ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=.09*ppm;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(A(AG.a))*r*1.1,cy+Math.sin(A(AG.a))*r*1.1);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=F(.7*ppm);ctx.textAlign='left';ctx.fillText(Math.round(AG.a)+'°',cx+r*.25,cy-r*.2);
    ctx.font=F(15,800);ctx.textAlign='center';ctx.fillStyle='#ffcf4a';ctx.fillText('RELEASE IN THE GREEN',W/2,118)}
}
function drawPops(dt){
  for(let i=G.pops.length-1;i>=0;i--){const p=G.pops[i];p.t+=dt;const life=p.big?1.7:1.1;if(p.t>life){G.pops.splice(i,1);continue}}
  let n=0;for(const p of G.pops){const life=p.big?1.7:1.1,k=p.t/life,sc=Math.min(1,p.t/.12)*(1+.25*Math.max(0,1-p.t/.25)),sz=(p.big?Math.min(64,W*.15):Math.min(34,W*.085))*sc;
    ctx.globalAlpha=k>.75?(1-k)/.25:1;ctx.font=F(sz);ctx.textAlign='center';ctx.lineWidth=sz*.16;ctx.strokeStyle='rgba(6,10,40,.85)';ctx.lineJoin='round';const y=H*(portrait?.22:.46)+n*46-k*14;
    ctx.strokeText(p.text,W/2,y);ctx.fillStyle=p.col;ctx.fillText(p.text,W/2,y);n++}
  ctx.globalAlpha=1;
}

/* ============================================================
   LOOP
   ============================================================ */
function update(dt){
  G.t+=dt;
  if(AG.on){AG.a+=AG.d*AG.rate*dt;if(AG.a>AG.hi){AG.a=AG.hi;AG.d=-1}if(AG.a<AG.lo){AG.a=AG.lo;AG.d=1}AG.t+=dt;if(AG.t>2.6)doRelease()}
  const C=G.C;if(!C)return;
  if(G.screen==='play'||C.demo)C.update(AG.on?0:dt);else if(G.screen==='intro')C.update(0);
  if(G.screen==='play'&&C.clap&&C.clap()){G.clapT=(G.clapT||0)-dt;if(G.clapT<=0){sfx.clap();G.clapT=lerp(.62,.26,clamp(C.P.v/10,0,1))}}
  const tx=C.focus()-viewW()*(C.frac||.3);if(G.snap){G.cam.x=tx;G.snap=false}else G.cam.x+=(tx-G.cam.x)*Math.min(1,dt*7);
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.t+=dt;if(p.t>p.life){G.parts.splice(i,1);continue}p.vy-=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.conf){p.vx+=Math.sin(p.t*8+i)*dt*3;if(p.vy<-2.5)p.vy=-2.5}else if(p.y<0){p.y=0;p.vy=0;p.vx*=.6}}
  G.shake=Math.max(0,G.shake-dt);G.flash=Math.max(0,G.flash-dt);G.cheerT=Math.max(0,G.cheerT-dt);
}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);const C=G.C;if(!C)return;
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*22,(Math.random()-.5)*G.shake*22);
  drawBackground();C.surface();groundTint();C.objs();
  for(const p of G.parts){ctx.globalAlpha=p.conf?1:1-p.t/p.life;ctx.fillStyle=p.col;if(p.conf)ctx.fillRect(X(p.x),Y(p.y),p.r*ppm*1.4,p.r*ppm*(.6+.8*Math.abs(Math.sin(p.t*9+p.x))));else{ctx.beginPath();ctx.arc(X(p.x),Y(p.y),p.r*ppm,0,TAU);ctx.fill()}}
  ctx.globalAlpha=1;ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+G.flash*.5+')';ctx.fillRect(0,0,W,H)}
  if(G.screen==='play'){drawHUD();drawPops(dt)}
}
let last=0;
function frame(now){const dt=Math.min(.034,(now-last)/1000||.016);last=now;if(!G.paused)update(dt);render(G.paused?0:dt);requestAnimationFrame(frame)}

/* ---------- input ---------- */
const inp={actId:null,actDown:false};
function inRun(){if(G.screen!=='play'||!G.C||G.paused)return;btn.run=1;G.C.onRun();sfx.tap()}
function inAct(d){if(G.screen!=='play'||!G.C||G.paused)return;inp.actDown=d;if(d){btn.act=1;G.C.onAct(true)}else if(AG.on)doRelease();else G.C.onAct(false)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(e.clientX<W/2)inRun();else{inp.actId=e.pointerId;inAct(true)}});
const up=e=>{if(e.pointerId===inp.actId){inp.actId=null;inAct(false)}};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
const RUNK=['ArrowRight','ArrowLeft','KeyA','KeyD','KeyF','KeyJ'],ACTK=['Space','ArrowUp','KeyK','Enter'];
window.addEventListener('keydown',e=>{if(e.repeat)return;if(G.screen==='play'){if(RUNK.includes(e.code)){inRun();e.preventDefault()}else if(ACTK.includes(e.code)){inAct(true);e.preventDefault()}}});
window.addEventListener('keyup',e=>{if(ACTK.includes(e.code)&&G.screen==='play')inAct(false)});
window.addEventListener('resize',()=>{resize();G.snap=true});

/* ---------- menus ---------- */
$('#bStart').onclick=()=>{menuMusic();SCORE_SENT=false;G.mode='deca';G.results=[];showIntro(0)};
function showPrac(){const pb=loadPB();$('#pgrid').innerHTML=EVENTS.map((e,i)=>`<button data-i="${i}">${e.name}<small>${pb[e.id]?fmtMark(e,pb[e.id].m)+' · '+pb[e.id].p+' pts':'no mark yet'}</small></button>`).join('');show('prac')}
$('#bPrac').onclick=()=>{menuMusic();showPrac()};
$('#bComp').onclick=()=>{menuMusic();const md=loadMedals();$('#lvls').innerHTML=LEVELS.map((l,i)=>`<button class="lvl" data-i="${i}"><b>${l.n}</b><small>${l.d}</small><em>${md[i]?(md[i]<4?['🥇','🥈','🥉'][md[i]-1]:ord(md[i])):''}</em></button>`).join('');show('comp')};
$('#lvls').onclick=e=>{const b=e.target.closest('.lvl');if(b)newComp(+b.dataset.i)};
$('#bCompBack').onclick=()=>show('title');
function pause(){if(G.screen!=='play'||G.paused)return;G.paused=true;if(AC)AC.suspend();applyOpt();if(AG.on){AG.on=false}inp.actDown=false;$('#pName').textContent=G.ev.name;$('#bRestart').style.display=G.mode==='practice'?'':'none';show('pause')}
$('#pauseB').onclick=pause;
$('#bResume').onclick=()=>{G.paused=false;if(AC)AC.resume();last=performance.now();show(null)};
$('#bRestart').onclick=()=>showIntro(G.idx);
$('#bQuit').onclick=toTitle;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('#bPracBack').onclick=()=>show('title');
$('#bGo').onclick=()=>{audioInit();if(G.ev.type==='race')Music.stop(.4);else Music.play('event');G.screen='play';G.C=makeController(G.ev);G.snap=true;show(null)};
$('#bAgain').onclick=()=>{if(G.mode==='comp')newComp(G.level);else{SCORE_SENT=false;G.mode='deca';G.results=[];showIntro(0)}};
$('#bMenu').onclick=toTitle;
$('#mute').onclick=()=>{OPT.mus=OPT.mus?0:1;menuMusic();applyOpt()};$('#fxB').onclick=()=>{OPT.sfx=OPT.sfx?0:1;audioInit();applyOpt()};
$('#pMus').onclick=()=>{OPT.mus=OPT.mus?0:1;applyOpt()};$('#pFx').onclick=()=>{OPT.sfx=OPT.sfx?0:1;applyOpt()};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button'))sfx.ui()},true);applyOpt();
$('#pgrid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=b.dataset.i;G.mode='practice';G.results=[];showIntro(+i)};

resize();toTitle();requestAnimationFrame(frame);
window.__GT={G,EVENTS,AG,inRun,inAct,showIntro,points,newComp,standings,showFinal,reportScore};
(function(){
  const btn=document.getElementById('fs');
  function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
  function go(){const el=document.documentElement;const fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn)fn.call(el)}
  function ex(){const fn=document.exitFullscreen||document.webkitExitFullscreen;if(fn)fn.call(document)}
  function tog(){isFs()?ex():go()}
  if(btn)btn.addEventListener('click',tog);
  window.addEventListener('keydown',e=>{if(e.code==='KeyP'&&!e.repeat){tog();e.preventDefault()}});
  try{if(new URLSearchParams(location.search).get('fs')==='1'){const once=()=>{go();document.removeEventListener('pointerdown',once,true)};document.addEventListener('pointerdown',once,true)}}catch(e){}
})();
</script>
